name: Süper Lig artifact pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "20 7 * * *"

permissions:
  contents: write

concurrency:
  group: turkey-artifact-pipeline
  cancel-in-progress: false

jobs:
  build-and-validate:
    uses: gmalbert/pitch-oracle-core/.github/workflows/precompute-consumer.yml@v1.3.26
    with:
      core_ref: v1.3.26
      league_key: turkey
      data_command: >-
        python -m combine_raw_data &&
        python -m fetch_upcoming_fixtures &&
        python -m prepare_model_data
      training_command: python -m train_models
      prediction_command: >-
        python scripts/fetch_live_odds.py &&
        python scripts/precompute_predictions.py
    secrets: inherit
